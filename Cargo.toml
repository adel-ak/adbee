[package]
name = "adbee"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "A friendly companion for adb: inspect devices, move files, pair over WiFi"
license = "MIT"
repository = "https://github.com/adel-ak/adbee"
readme = "README.md"
keywords = ["adb", "android", "cli", "wireless", "debugging"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".vscode"]

[dependencies]
adb_client = "3"
console = "0.16"
demand = "2"
indicatif = "0.18.6"
mdns-sd = "0.21"
qr2term = "0.3"
rand = "0.8"
usage-rs = { version = "7.3", features = ["completions"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
